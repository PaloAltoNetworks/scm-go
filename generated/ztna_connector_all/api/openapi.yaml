openapi: 3.0.0
info:
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: https://support.paloaltonetworks.com
  description: ZTNA Connector Restful API Specification
  license:
    name: Palo Alto Networks EULA
    url: https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf
  termsOfService: https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf
  title: ZTNA Connector Restful API
  version: v2
servers:
- description: ZTNA Connector API
  url: https://api.sase.paloaltonetworks.com/sse/connector/v2.0/api
security:
- bearerAuth: []
tags:
- description: Tenant management operations
  name: Tenant
  x-displayName: Tenant
- description: Connector Group management operations
  name: Connector-Group
  x-displayName: Connector Group
- description: Connector management operations
  name: Connector
  x-displayName: Connector
- description: FQDN Rules management operations
  name: FQDN
  x-displayName: FQDN
- description: Subnet management operations
  name: Subnet
  x-displayName: Subnet
- description: Wildcard management operations
  name: Wildcard
  x-displayName: Wildcard
- description: Discovered Application operations
  name: Discovered-Application
  x-displayName: Discovered Application
paths:
  /applications:
    get:
      operationId: ListApplications
      parameters:
      - description: The region of the tenant
        explode: false
        in: header
        name: x-panw-region
        required: false
        schema:
          enum:
          - ae
          - americas
          - au
          - br
          - ca
          - ch
          - cn
          - de
          - es
          - europe
          - fr
          - id
          - il
          - in
          - it
          - jp
          - kr
          - pl
          - qa
          - sa
          - sg
          - tw
          - uk
          - za
          type: string
        style: simple
      - description: |
          A 0-based offset into the collection.
          It is the index of the starting entry of the page
        explode: true
        in: query
        name: offset
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: The max count in result entry (count per page)
        explode: true
        in: query
        name: limit
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: List of fields from item response to sort by.
        examples:
          threeItems:
            summary: "An example sort list that sorts first by A in ascending order,\
              \ then B in descending order, and finally C in ascending order."
            value: "A[asc],B[desc],C"
        explode: true
        in: query
        name: sort
        required: false
        schema:
          type: string
        style: form
      - description: String to filter list results by. Is searched over multiple fields
          in each object. Multiple searches can be specified.
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: connector1
          type: string
        style: form
      - description: String to filter list results by searching one specified field
          of an object. Multiple filters can be specified.
        examples:
          freeFormFilter:
            summary: A free form filter on the field name searching for a substring
              match of abc.
            value: "{\"field\":\"name\",\"search\":\"abc\"}"
          staticFilter:
            summary: A static filter on the field connector_group searching for an
              exact match of abc.
            value: "{\"field\":\"connector_group\",\"filter\":\"abc\"}"
        explode: true
        in: query
        name: filters
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsListResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
          description: Unauthorized
      summary: List FQDNs
      tags:
      - FQDN
    post:
      operationId: CreateApplications
      parameters:
      - description: The region of the tenant
        explode: false
        in: header
        name: x-panw-region
        required: false
        schema:
          enum:
          - ae
          - americas
          - au
          - br
          - ca
          - ch
          - cn
          - de
          - es
          - europe
          - fr
          - id
          - il
          - in
          - it
          - jp
          - kr
          - pl
          - qa
          - sa
          - sg
          - tw
          - uk
          - za
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/applications'
        required: true
      responses:
        "201":
          description: |
            [201 Created](https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/201)
          x-summary: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_response'
          description: Conflict
      summary: Create FQDN
      tags:
      - FQDN
