openapi: 3.0.0
info:
  contact:
    email: support@paloaltonetworks.com
    name: Palo Alto Networks Technical Support
    url: https://support.paloaltonetworks.com
  description: These APIs are used for reading and managing Cloud NGFW firewall resources
    on AWS.
  license:
    name: MIT
    url: https://opensource.org/license/mit
  termsOfService: https://www.paloaltonetworks.com/content/dam/pan/en_US/assets/pdf/legal/palo-alto-networks-end-user-license-agreement-eula.pdf
  title: Cloud NGFW
  version: 2.0.0
  x-tf-cngfw: true
servers:
- description: Current
  url: https://api.strata.paloaltonetworks.com/cngfw-aws/v2/config
security:
- scmToken: []
tags:
- description: Cloud NGFW Firewalls
  name: Ngfirewalls
paths:
  /ngfirewalls:
    get:
      description: |
        List Cloud NGFW firewalls with optional filtering parameters. Use ListCloudNGFirewalls (Go SDK)
        or list_cloud_ng_firewalls (Python SDK) instead; they return the complete list across all pages.
      operationId: ListNgfirewalls
      parameters:
      - description: The AWS region where the Cloud NGFW firewall is deployed
        explode: true
        in: query
        name: region
        required: true
        schema:
          type: string
        style: form
      - description: Name of the global rulestack to filter by.
        explode: true
        in: query
        name: globalrulestackname
        required: false
        schema:
          type: string
        style: form
      - description: |
          Controls how much detail the list response contains. Use ListCloudNGFirewalls (Go SDK) or
          list_cloud_ng_firewalls (Python SDK), which always request the detailed listing
          (describe=true) and return it in FirewallsDescribe. Calling the raw list method with
          describe=false returns only a summary that this SDK does not expose.
        explode: true
        in: query
        name: describe
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ngfirewalls-list-response'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Forbidden
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: General Errors
      summary: List Cloud NGFW firewalls
      tags:
      - Ngfirewalls
    post:
      description: |
        Creates a Cloud NGFW firewall. Use CreateCloudNGFirewall (Go SDK) or create_cloud_ng_firewall (Python SDK) instead.
      operationId: CreateNgfirewalls
      parameters:
      - description: The AWS region where the Cloud NGFW firewall is deployed
        explode: true
        in: query
        name: region
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ngfirewall-create-request'
        description: Firewall configuration
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ngfirewall-create-response'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Forbidden
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: General Errors
      summary: Create a Cloud NGFW firewall
      tags:
      - Ngfirewalls
  /ngfirewalls/{id}:
    delete:
      description: |
        Deletes a Cloud NGFW firewall. Use DeleteCloudNGFirewall (Go SDK) or delete_cloud_ng_firewall (Python SDK) instead.
      operationId: DeleteNgfirewallsByID
      parameters:
      - description: The ID of the Cloud NGFW firewall.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: The AWS region where the Cloud NGFW firewall is deployed
        explode: true
        in: query
        name: region
        required: true
        schema:
          type: string
        style: form
      - description: "Identifies the client that originated the request (e.g. SCM-SDK,\
          \ Terraform-Provider-SCM)."
        explode: true
        in: query
        name: source
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: General Errors
      summary: Delete a Cloud NGFW firewall.
      tags:
      - Ngfirewalls
    get:
      description: |
        Retrieve details of a specific Cloud NGFW firewall by its ID.
      operationId: GetNgfirewallsByID
      parameters:
      - description: The ID of the Cloud NGFW firewall.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: The AWS region where the Cloud NGFW firewall is deployed
        explode: true
        in: query
        name: region
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ngfirewalls'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: General Errors
      summary: Get a Cloud NGFW firewall
      tags:
      - Ngfirewalls
    patch:
      description: |
        Update an existing Cloud NGFW firewall. Supports updating Tags, Description,
        Tier (upgrade only: standard to premium), AllowListAccounts, ChangeProtection, CustomerZoneIdList,
        EgressNAT, ScmLabels, LinkId, GwlbTcpIdleTimeout,
        PrivateAccess, Endpoints, and UserID. The request must include the UpdateToken and
        DeploymentUpdateToken values from a recent GET of the same firewall.
      operationId: UpdateNgfirewallsByID
      parameters:
      - description: The ID of the Cloud NGFW firewall.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: The AWS region where the Cloud NGFW firewall is deployed
        explode: true
        in: query
        name: region
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ngfirewall-update-request'
        description: Firewall configuration
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ngfirewall-update-response'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: Not Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/generic_error'
          description: General Errors
      summary: Update a Cloud NGFW firewall
      tags:
      - Ngfirewalls
components:
  parameters:
    path.describe:
      description: |
        Controls how much detail the list response contains. Use ListCloudNGFirewalls (Go SDK) or
        list_cloud_ng_firewalls (Python SDK), which always request the detailed listing
        (describe=true) and return it in FirewallsDescribe. Calling the raw list method with
        describe=false returns only a summary that this SDK does not expose.
      explode: true
      in: query
      name: describe
      required: false
      schema:
        type: string
      style: form
    path.globalrulestackname:
      description: Name of the global rulestack to filter by.
      explode: true
      in: query
      name: globalrulestackname
      required: false
      schema:
        type: string
      style: form
    path.id:
      description: The ID of the Cloud NGFW firewall.
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    path.region:
      description: The AWS region where the Cloud NGFW firewall is deployed
      explode: true
      in: query
      name: region
      required: true
      schema:
        type: string
      style: form
    path.source:
      description: "Identifies the client that originated the request (e.g. SCM-SDK,\
        \ Terraform-Provider-SCM)."
      explode: true
      in: query
      name: source
      required: false
      schema:
        type: string
      style: form
  responses:
    access_errors:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
      description: Forbidden
    auth_errors:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
      description: Unauthorized
    bad_request_errors_basic:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
      description: Bad Request
    bad_request_errors_basic_with_body:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
      description: Bad Request
    default_errors:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
      description: General Errors
    http_ok:
      description: OK
    not_found:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generic_error'
      description: Not Found
  schemas:
    generic_error:
      example:
        _request_id: _request_id
        _errors:
        - help: help
          code: code
          details: "{}"
          message: message
        - help: help
          code: code
          details: "{}"
          message: message
      properties:
        _errors:
          items:
            $ref: '#/components/schemas/generic_error__errors_inner'
          type: array
        _request_id:
          type: string
      type: object
      x-examples: {}
    ngfirewall-cloudwatch-metrics:
      description: CloudWatch metrics configuration.
      example:
        AccountId: AccountId
        CloudWatchMetricNamespace: CloudWatchMetricNamespace
        CloudWatchMetricsFields:
        - CloudWatchMetricsFields
        - CloudWatchMetricsFields
      properties:
        AccountId:
          description: The AWS account ID where CloudWatch metrics are published.
          maxLength: 12
          minLength: 12
          type: string
        CloudWatchMetricNamespace:
          description: The CloudWatch metric namespace.
          type: string
        CloudWatchMetricsFields:
          description: The CloudWatch metric field names to publish.
          items:
            type: string
          type: array
      type: object
    ngfirewall-commit-info:
      description: Commit information for a rulestack.
      example:
        CommitTS: CommitTS
        CommitMessages:
        - CommitMessages
        - CommitMessages
      properties:
        CommitMessages:
          description: Messages produced during the commit operation.
          items:
            type: string
          type: array
        CommitTS:
          description: Timestamp of the last commit operation.
          type: string
      type: object
    ngfirewall-create-request:
      description: Request body for creating a new Cloud NGFW firewall.
      properties:
        AllowListAccounts:
          description: AWS account IDs permitted to access the firewall endpoint service.
          items:
            type: string
          maxItems: 300
          type: array
          x-computed-field: true
        ChangeProtection:
          description: List of attributes protected from change.
          items:
            type: string
          type: array
          x-computed-field: true
        CustomerZoneIdList:
          description: List of customer-defined security zone IDs. Required.
          items:
            type: string
          type: array
        Description:
          description: A human-readable description of the firewall.
          type: string
        EgressNAT:
          $ref: '#/components/schemas/ngfirewall-egress-nat-config'
        Endpoints:
          description: Firewall endpoint configurations. Assigned by the service when
            the firewall is created; can be changed with an update.
          items:
            $ref: '#/components/schemas/ngfirewall-endpoint'
          type: array
          x-computed-field: true
        GwlbTcpIdleTimeout:
          description: GWLB TCP idle timeout in seconds. Defaults to 350; can be changed
            with an update.
          type: integer
          x-computed-field: true
        LinkId:
          description: The link ID to associate with the firewall.
          type: string
          x-computed-field: true
        Mode:
          description: "The operational mode of the firewall, either CNGFW or AIRSM.\
            \ Set when the firewall is created and cannot be changed afterward."
          enum:
          - CNGFW
          - AIRSM
          type: string
        PrivateAccess:
          $ref: '#/components/schemas/ngfirewall-private-access'
        ScmLabels:
          description: Strata Cloud Manager (SCM) labels to apply to the firewall.
          items:
            maxLength: 256
            minLength: 1
            type: string
          type: array
        Source:
          description: The source SDK or provider that created the firewall. Automatically
            set by the SDK or Terraform provider; do not set this field manually.
          enum:
          - SCM-SDK
          - Terraform-Provider-SCM
          type: string
        Tags:
          description: AWS resource tags to apply to the firewall.
          items:
            $ref: '#/components/schemas/ngfirewall-tag'
          maxItems: 50
          type: array
        Tier:
          description: "The service tier for the firewall, either standard or premium."
          enum:
          - standard
          - premium
          type: string
          x-computed-field: true
        UserID:
          $ref: '#/components/schemas/ngfirewall-user-id'
      required:
      - CustomerZoneIdList
      type: object
    ngfirewall-create-response:
      description: Response envelope returned by the Create Cloud NGFW firewall API.
      example:
        Response:
          CustomerZoneIdList:
          - CustomerZoneIdList
          - CustomerZoneIdList
          Description: Description
          Tier: ""
          ChangeProtection:
          - ChangeProtection
          - ChangeProtection
          FirewallId: FirewallId
          Mode: ""
          EgressNAT:
            Enabled: true
            Settings:
              IPPoolType: AWSService
              IPAMPoolId: IPAMPoolId
          ScmLabels:
          - ScmLabels
          - ScmLabels
          AllowListAccounts:
          - AllowListAccounts
          - AllowListAccounts
          - AllowListAccounts
          - AllowListAccounts
          - AllowListAccounts
          LinkId: LinkId
          Tags:
          - Value: Value
            Key: Key
          - Value: Value
            Key: Key
          - Value: Value
            Key: Key
          - Value: Value
            Key: Key
          - Value: Value
            Key: Key
          UpdateToken: UpdateToken
        ResponseStatus:
          ErrorCode: 7
          Reason: Reason
      properties:
        Response:
          $ref: '#/components/schemas/ngfirewall-create-response-body'
        ResponseStatus:
          $ref: '#/components/schemas/ngfirewall-response-status'
      type: object
    ngfirewall-create-response-body:
      description: Inner response body returned after creating a Cloud NGFW firewall.
      example:
        CustomerZoneIdList:
        - CustomerZoneIdList
        - CustomerZoneIdList
        Description: Description
        Tier: ""
        ChangeProtection:
        - ChangeProtection
        - ChangeProtection
        FirewallId: FirewallId
        Mode: ""
        EgressNAT:
          Enabled: true
          Settings:
            IPPoolType: AWSService
            IPAMPoolId: IPAMPoolId
        ScmLabels:
        - ScmLabels
        - ScmLabels
        AllowListAccounts:
        - AllowListAccounts
        - AllowListAccounts
        - AllowListAccounts
        - AllowListAccounts
        - AllowListAccounts
        LinkId: LinkId
        Tags:
        - Value: Value
          Key: Key
        - Value: Value
          Key: Key
        - Value: Value
          Key: Key
        - Value: Value
          Key: Key
        - Value: Value
          Key: Key
        UpdateToken: UpdateToken
      properties:
        AllowListAccounts:
          description: AWS account IDs permitted to access the firewall endpoint service.
          items:
            type: string
          maxItems: 300
          type: array
        ChangeProtection:
          description: List of attributes protected from change.
          items:
            type: string
          type: array
        CustomerZoneIdList:
          description: List of customer-defined security zone IDs.
          items:
            type: string
          type: array
        Description:
          description: A human-readable description of the firewall.
          type: string
        EgressNAT:
          $ref: '#/components/schemas/ngfirewall-egress-nat-config'
        FirewallId:
          description: The unique identifier of the created firewall.
          type: string
        LinkId:
          description: The link ID associated with the firewall.
          type: string
        Mode:
          description: The operational mode of the firewall.
        ScmLabels:
          description: Strata Cloud Manager (SCM) labels applied to the firewall.
          items:
            maxLength: 256
            minLength: 1
            type: string
          type: array
        Tags:
          description: AWS resource tags applied to the firewall.
          items:
            $ref: '#/components/schemas/ngfirewall-tag'
          maxItems: 50
          type: array
        Tier:
          description: The service tier of the firewall.
        UpdateToken:
          description: Optimistic locking token for subsequent update operations.
          type: string
      required:
      - CustomerZoneIdList
      type: object
    ngfirewall-egress-nat-config:
      description: Egress NAT configuration for outbound traffic.
      example:
        Enabled: true
        Settings:
          IPPoolType: AWSService
          IPAMPoolId: IPAMPoolId
      properties:
        Enabled:
          description: Whether egress NAT is enabled on this firewall.
          type: boolean
        Settings:
          $ref: '#/components/schemas/ngfirewall-egress-nat-settings'
      type: object
      x-computed-field: true
    ngfirewall-egress-nat-settings:
      description: Settings for egress NAT IP address management.
      example:
        IPPoolType: AWSService
        IPAMPoolId: IPAMPoolId
      properties:
        IPAMPoolId:
          description: The IPAM pool ID used for egress NAT IP allocation.
          type: string
        IPPoolType:
          description: The IP pool type for egress NAT.
          enum:
          - AWSService
          - BYOIP
          type: string
      type: object
    ngfirewall-endpoint:
      description: Configuration and status of a single firewall VPC endpoint.
      example:
        Status: Pending
        AccountId: AccountId
        VpcId: VpcId
        ZoneId: ZoneId
        EgressNATEnabled: true
        EndpointId: EndpointId
        Mode: ServiceManaged
        SubnetId: SubnetId
        Prefixes:
          PublicPrefix:
            Cidrs:
            - Cidrs
            - Cidrs
          PrivatePrefix:
            Cidrs:
            - Cidrs
            - Cidrs
        RejectedReason: RejectedReason
      properties:
        AccountId:
          description: The AWS account ID that owns this endpoint.
          maxLength: 12
          minLength: 12
          type: string
          x-computed-field: true
        EgressNATEnabled:
          description: Whether egress NAT is enabled for this endpoint.
          type: boolean
          x-computed-field: true
        EndpointId:
          description: The VPC endpoint ID.
          type: string
          x-computed-field: true
        Mode:
          description: The endpoint management mode.
          enum:
          - ServiceManaged
          - CustomerManaged
          type: string
          x-computed-field: true
        Prefixes:
          $ref: '#/components/schemas/ngfirewall-endpoint-prefixes'
        RejectedReason:
          description: Human-readable reason if the endpoint was rejected.
          type: string
          x-computed-field: true
        Status:
          description: The current provisioning status of the endpoint.
          enum:
          - Pending
          - Accepted
          - Rejected
          - Created
          - Creating
          - Deleting
          type: string
          x-computed-field: true
        SubnetId:
          description: The AWS subnet ID in which the endpoint resides.
          type: string
          x-computed-field: true
        VpcId:
          description: The AWS VPC ID in which the endpoint resides.
          type: string
          x-computed-field: true
        ZoneId:
          description: The availability zone ID for this endpoint.
          type: string
          x-computed-field: true
      type: object
    ngfirewall-endpoint-prefixes:
      description: IP prefix lists associated with a firewall endpoint.
      example:
        PublicPrefix:
          Cidrs:
          - Cidrs
          - Cidrs
        PrivatePrefix:
          Cidrs:
          - Cidrs
          - Cidrs
      properties:
        PrivatePrefix:
          $ref: '#/components/schemas/ngfirewall-prefix-list'
        PublicPrefix:
          $ref: '#/components/schemas/ngfirewall-prefix-list'
      type: object
      x-computed-field: true
    ngfirewall-firewall:
      description: Core firewall configuration and identity fields.
      example:
        Description: Description
        FirewallId: FirewallId
        GWLB:
          DeregistrationDelay: 0
          RejectedFlowCountAlertThreshold: 6
          TCPIdleTimeout: 5
          RejectedFlowCountTCPAlertThreshold: 1
          SessionRebalanceEnabled: false
        EndpointServiceName: EndpointServiceName
        DeploymentUpdateToken: DeploymentUpdateToken
        UpdateToken: UpdateToken
        Endpoints:
        - Status: Pending
          AccountId: AccountId
          VpcId: VpcId
          ZoneId: ZoneId
          EgressNATEnabled: true
          EndpointId: EndpointId
          Mode: ServiceManaged
          SubnetId: SubnetId
          Prefixes:
            PublicPrefix:
              Cidrs:
              - Cidrs
              - Cidrs
            PrivatePrefix:
              Cidrs:
              - Cidrs
              - Cidrs
          RejectedReason: RejectedReason
        - Status: Pending
          AccountId: AccountId
          VpcId: VpcId
          ZoneId: ZoneId
          EgressNATEnabled: true
          EndpointId: EndpointId
          Mode: ServiceManaged
          SubnetId: SubnetId
          Prefixes:
            PublicPrefix:
              Cidrs:
              - Cidrs
              - Cidrs
            PrivatePrefix:
              Cidrs:
              - Cidrs
              - Cidrs
          RejectedReason: RejectedReason
        UserID:
          SecretKeyARN: SecretKeyARN
          EndpointDNS: EndpointDNS
          UserIDStatus: EndpointPending
          Port: 2
          Enabled: true
          AgentName: AgentName
          CFTURLLink: CFTURLLink
          CollectorName: CollectorName
          CustomIncludeExcludeNetwork:
          - NetworkAddress: NetworkAddress
            DiscoveryInclude: true
            Enabled: true
            Name: Name
          - NetworkAddress: NetworkAddress
            DiscoveryInclude: true
            Enabled: true
            Name: Name
        CloudwatchMetrics:
          AccountId: AccountId
          CloudWatchMetricNamespace: CloudWatchMetricNamespace
          CloudWatchMetricsFields:
          - CloudWatchMetricsFields
          - CloudWatchMetricsFields
        Tags:
        - Value: Value
          Key: Key
        - Value: Value
          Key: Key
        - Value: Value
          Key: Key
        - Value: Value
          Key: Key
        - Value: Value
          Key: Key
        LinkStatus: LinkStatus
        Ipv6:
          Enabled: true
        Tier: Tier
        AdvancedThreatLog: true
        PrivateAccess:
          Type: NetworkLoadBalancer
          ResourceID: ResourceID
        CustomerZoneIdList:
        - CustomerZoneIdList
        - CustomerZoneIdList
        SoftwareVersion: SoftwareVersion
        DeviceRuleStackCommitStatus: DeviceRuleStackCommitStatus
        ChangeProtection:
        - ChangeProtection
        - ChangeProtection
        EgressNAT:
          Enabled: true
          Settings:
            IPPoolType: AWSService
            IPAMPoolId: IPAMPoolId
        Region: Region
        AllowListAccounts:
        - AllowListAccounts
        - AllowListAccounts
        Notifications:
        - Msg: Msg
          ExpiryTime: 5
          Id: Id
          Link:
            Target: Target
            Text: Text
        - Msg: Msg
          ExpiryTime: 5
          Id: Id
          Link:
            Target: Target
            Text: Text
        LinkId: LinkId
        LogConfig:
